<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .bg { fill: #0f1115; }
      .surface { fill: #17181c; stroke: #262930; stroke-width: 1.5; }
      .surface-highlight { fill: #1c1f26; stroke: #c8863c; stroke-width: 1.5; }
      .sub-surface { fill: #121418; stroke: #20232a; stroke-width: 1; }
      .text-title { font-family: 'Lexend Deca', sans-serif; font-size: 22px; font-weight: 600; fill: #ededed; }
      .text-heading { font-family: 'Lexend Deca', sans-serif; font-size: 16px; font-weight: 500; fill: #ffffff; }
      .text-sub { font-family: 'Lexend Deca', sans-serif; font-size: 13px; font-weight: 400; fill: #8e929b; }
      .text-code { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #c8863c; }
      .text-code-dim { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; fill: #727782; }
      .text-code-active { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #4ade80; }
      .accent-pill { fill: rgba(200, 134, 60, 0.12); stroke: #c8863c; stroke-width: 1; }
      .accent-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; fill: #c8863c; }
      .flow-line { stroke: #323742; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
      .flow-line-active { stroke: #c8863c; stroke-width: 1.5; fill: none; }
      .tag { fill: #20232a; rx: 3; }
      .tag-text { font-family: 'Lexend Deca', sans-serif; font-size: 11px; fill: #9da1ab; }
      .dot-amber { fill: #c8863c; }
      .dot-green { fill: #4ade80; }
      .dot-gray { fill: #3f4450; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" class="bg" />

  <!-- Subtle grid pattern -->
  <g opacity="0.15">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200 M0 675 H1200" stroke="#333742" stroke-width="0.5" />
    <path d="M100 0 V750 M200 0 V750 M300 0 V750 M400 0 V750 M500 0 V750 M600 0 V750 M700 0 V750 M800 0 V750 M900 0 V750 M1000 0 V750 M1100 0 V750" stroke="#333742" stroke-width="0.5" />
  </g>

  <!-- Card 1: Context Layer (don-os) -->
  <g transform="translate(60, 80)">
    <rect width="320" height="590" rx="8" class="surface" />
    
    <!-- Header -->
    <rect width="320" height="52" rx="8" fill="#131418" />
    <circle cx="24" cy="26" r="4" class="dot-amber" />
    <text x="38" y="31" class="text-heading">don-os / context layer</text>
    <rect x="235" y="15" width="68" height="22" rx="4" class="accent-pill" />
    <text x="246" y="30" class="accent-text">v1.1 git</text>

    <!-- Context files list -->
    <g transform="translate(20, 75)">
      <!-- profile.md -->
      <rect width="280" height="85" rx="6" class="sub-surface" />
      <text x="16" y="28" class="text-code">profile.md</text>
      <text x="16" y="50" class="text-sub">Designer, OTT &amp; CE background</text>
      <text x="16" y="68" class="text-code-dim">Systems thinker, builds in code</text>
      
      <!-- taste.md -->
      <g transform="translate(0, 100)">
        <rect width="280" height="85" rx="6" class="sub-surface" stroke="#c8863c" stroke-width="1" />
        <text x="16" y="28" class="text-code">taste.md</text>
        <text x="16" y="50" class="text-sub">Quiet, deadpan, negative space</text>
        <text x="16" y="68" class="text-code-dim">No gradients, muted + 1 accent</text>
      </g>

      <!-- workflow.md -->
      <g transform="translate(0, 200)">
        <rect width="280" height="85" rx="6" class="sub-surface" />
        <text x="16" y="28" class="text-code">workflow.md</text>
        <text x="16" y="50" class="text-sub">Frame → Spec → Explore → Build</text>
        <text x="16" y="68" class="text-code-dim">Verify rendered result, not edit</text>
      </g>

      <!-- voice.md & standards.md -->
      <g transform="translate(0, 300)">
        <rect width="280" height="85" rx="6" class="sub-surface" />
        <text x="16" y="28" class="text-code">voice.md + standards.md</text>
        <text x="16" y="50" class="text-sub">Plain English, avoid AI-tells</text>
        <text x="16" y="68" class="text-code-dim">Sentence case, no hype words</text>
      </g>

      <!-- Status badge -->
      <g transform="translate(0, 405)">
        <rect width="280" height="42" rx="6" fill="#15171c" stroke="#252932" stroke-width="1" />
        <circle cx="16" cy="21" r="3.5" class="dot-green" />
        <text x="30" y="25" class="text-code-active">synced across local agents</text>
      </g>
    </g>
  </g>

  <!-- Connectors from don-os to Agents -->
  <path d="M380 250 H440" class="flow-line-active" />
  <circle cx="440" cy="250" r="3" fill="#c8863c" />
  <path d="M380 420 H440" class="flow-line-active" />
  <circle cx="440" cy="420" r="3" fill="#c8863c" />

  <!-- Card 2: Agentic Execution (Claude Code + Google Antigravity) -->
  <g transform="translate(440, 80)">
    <rect width="320" height="590" rx="8" class="surface" />
    
    <!-- Header -->
    <rect width="320" height="52" rx="8" fill="#131418" />
    <circle cx="24" cy="26" r="4" class="dot-amber" />
    <text x="38" y="31" class="text-heading">agentic execution</text>

    <g transform="translate(20, 75)">
      <!-- Antigravity / Claude Code box -->
      <rect width="280" height="175" rx="6" class="sub-surface" />
      <text x="16" y="28" class="text-heading" font-size="14">Claude Code + Antigravity</text>
      
      <!-- Terminal simulation -->
      <rect x="14" y="42" width="252" height="118" rx="4" fill="#0b0d10" />
      <text x="24" y="64" class="text-code-dim">$ agy run --spec design-spec.md</text>
      <text x="24" y="84" class="text-code-dim">reading /Projects/don-os/*.md</text>
      <text x="24" y="104" class="text-code">✓ taste guidelines enforced</text>
      <text x="24" y="124" class="text-code-active">✓ generating interactive UI</text>
      <text x="24" y="144" class="text-code-dim">→ hot reloading local server</text>

      <!-- Hardware agent -->
      <g transform="translate(0, 190)">
        <rect width="280" height="135" rx="6" class="sub-surface" />
        <text x="16" y="28" class="text-heading" font-size="14">Local assistant (Mac Mini)</text>
        <text x="16" y="52" class="text-sub">Dedicated 24/7 hardware</text>
        <text x="16" y="74" class="text-code-dim">• Reads don-os on boot &amp; timer</text>
        <text x="16" y="94" class="text-code-dim">• Real-time memory injection</text>
        <text x="16" y="114" class="text-code-dim">• Instant Telegram/chat interface</text>
      </g>

      <!-- Knowledge vault -->
      <g transform="translate(0, 340)">
        <rect width="280" height="110" rx="6" class="sub-surface" />
        <text x="16" y="28" class="text-heading" font-size="14">Personal knowledge vault</text>
        <text x="16" y="52" class="text-sub">Research &amp; inspiration index</text>
        <text x="16" y="74" class="text-code-dim">• Auto-categorized bookmarks</text>
        <text x="16" y="94" class="text-code-dim">• Plaintext markdown database</text>
      </g>
    </g>
  </g>

  <!-- Connectors from Agents to Shipped Code -->
  <path d="M760 250 H820" class="flow-line-active" />
  <circle cx="820" cy="250" r="3" fill="#c8863c" />
  <path d="M760 420 H820" class="flow-line-active" />
  <circle cx="820" cy="420" r="3" fill="#c8863c" />

  <!-- Card 3: Shipped Code & Live Product -->
  <g transform="translate(820, 80)">
    <rect width="320" height="590" rx="8" class="surface-highlight" />
    
    <!-- Header -->
    <rect width="320" height="52" rx="8" fill="#131418" />
    <circle cx="24" cy="26" r="4" class="dot-green" />
    <text x="38" y="31" class="text-heading">shipped product in code</text>

    <g transform="translate(20, 75)">
      <!-- Live UI Preview Window -->
      <rect width="280" height="230" rx="6" fill="#0d0f12" stroke="#252932" stroke-width="1" />
      
      <!-- Window top bar -->
      <rect width="280" height="28" rx="6" fill="#16181d" />
      <circle cx="16" cy="14" r="3" fill="#ff5f56" />
      <circle cx="26" cy="14" r="3" fill="#ffbd2e" />
      <circle cx="36" cy="14" r="3" fill="#27c93f" />
      <text x="105" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6d7280">localhost:3000</text>

      <!-- Rendered Mock UI in window -->
      <g transform="translate(16, 42)">
        <rect width="140" height="12" rx="2" fill="#ededed" opacity="0.9" />
        <rect y="20" width="248" height="6" rx="2" fill="#4d5360" />
        <rect y="32" width="210" height="6" rx="2" fill="#4d5360" />
        
        <!-- Interactive UI component -->
        <rect y="50" width="118" height="60" rx="4" fill="#1a1c22" stroke="#c8863c" stroke-width="1" />
        <text x="10" y="70" class="text-code" font-size="10">Active UI</text>
        <text x="10" y="88" class="text-code-dim" font-size="9">working code</text>
        
        <rect x="130" y="50" width="118" height="60" rx="4" fill="#1a1c22" stroke="#2a2e38" stroke-width="1" />
        <text x="140" y="70" class="text-sub" font-size="10">Tokens</text>
        <text x="140" y="88" class="text-code-dim" font-size="9">machine-ready</text>

        <!-- CTA in mock UI -->
        <rect y="122" width="248" height="26" rx="3" fill="#c8863c" opacity="0.9" />
        <text x="80" y="139" font-family="'Lexend Deca', sans-serif" font-size="11" font-weight="600" fill="#0f1115">Inspect Prototype</text>
      </g>

      <!-- Outcome summary -->
      <g transform="translate(0, 250)">
        <rect width="280" height="200" rx="6" class="sub-surface" />
        <text x="16" y="28" class="text-heading" font-size="14">What changed</text>
        
        <g transform="translate(16, 45)">
          <circle cx="4" cy="6" r="3" class="dot-amber" />
          <text x="16" y="10" class="text-sub">Working interactive prototype</text>
          
          <circle cx="4" cy="36" r="3" class="dot-amber" />
          <text x="16" y="40" class="text-sub">Prototype &amp; push in same sitting</text>

          <circle cx="4" cy="66" r="3" class="dot-amber" />
          <text x="16" y="70" class="text-sub">High-fidelity interactive outcome</text>

          <circle cx="4" cy="96" r="3" class="dot-amber" />
          <text x="16" y="100" class="text-sub">Taste codified as a quality gate</text>
        </g>
      </g>
    </g>
  </g>
</svg>
